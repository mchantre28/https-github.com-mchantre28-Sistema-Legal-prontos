services:
  - type: web
    name: sistema-legal-api
    runtime: node
    rootDir: projetos/sistema-legal/backend
    buildCommand: npm install && npm run seed
    startCommand: npm start
    envVars:
      - key: JWT_SECRET
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: BREVO_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: EMAIL_PROVIDER
        sync: false
      - key: PORTAL_URL
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_FROM
        sync: false
      - key: PORTAL_URL
        sync: false
      - key: NODE_ENV
        value: production
      - key: DATA_DIR
        value: /opt/render/project/src/projetos/sistema-legal/backend/data
    disk:
      name: sistema-legal-data
      mountPath: /opt/render/project/src/projetos/sistema-legal/backend/data
      sizeGB: 1
