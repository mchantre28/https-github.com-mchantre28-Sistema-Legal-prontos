services:
  - type: web
    name: sistema-legal-api
    runtime: node
    rootDir: projetos/sistema-legal/backend
    buildCommand: npm install && npm run seed
    startCommand: npm start
    envVars:
      - key: JWT_SECRET
        sync: false
      - key: NODE_ENV
        value: production
      - key: DATA_DIR
        value: /opt/render/project/src/projetos/sistema-legal/backend/data
    disk:
      name: sistema-legal-data
      mountPath: /opt/render/project/src/projetos/sistema-legal/backend/data
      sizeGB: 1
