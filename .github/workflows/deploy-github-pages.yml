# Publica o frontend estático (projetos/sistema-legal) na raiz do GitHub Pages.
# Após o primeiro push: Settings → Pages → Source → GitHub Actions.
name: Deploy GitHub Pages — Sistema Legal

on:
  push:
    branches: [main]
    paths:
      - 'projetos/sistema-legal/**'
      - '.github/workflows/deploy-github-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-sistema-legal
  cancel-in-progress: false

jobs:
  deploy:
    name: Publicar frontend
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # Só o frontend. Evita descarregar o monorepo inteiro.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          sparse-checkout: |
            projetos/sistema-legal
          sparse-checkout-cone-mode: true

      - name: Preparar artefacto do site
        run: |
          set -e
          SRC="projetos/sistema-legal"
          OUT="_site"
          mkdir -p "$OUT"
          rsync -a \
            --exclude '.git/' \
            --exclude '.github/' \
            --exclude '_site/' \
            --exclude 'android/' \
            --exclude 'ios/' \
            --exclude 'backend/' \
            --exclude 'node_modules/' \
            --exclude 'www/' \
            --exclude 'resources/' \
            --exclude 'scripts/' \
            --exclude 'tests/' \
            --exclude 'e2e/' \
            --exclude '*.md' \
            --exclude '*.bat' \
            --exclude '*.ps1' \
            "$SRC/" "$OUT/"
          touch "$OUT/.nojekyll"
          if [ ! -f "$OUT/404.html" ]; then
            cp "$OUT/index.html" "$OUT/404.html"
          fi
          test -f "$OUT/index.html"
          test -f "$OUT/script.js"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
