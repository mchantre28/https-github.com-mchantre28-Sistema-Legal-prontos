# Publica o frontend estático (projetos/sistema-legal) na raiz do GitHub Pages.
# Após o primeiro push: Settings → Pages → Source → GitHub Actions.
name: Deploy GitHub Pages — Sistema Legal

on:
  push:
    branches: [main]
    paths:
      - 'projetos/sistema-legal/**'
      - '.github/workflows/deploy-github-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-sistema-legal
  cancel-in-progress: true

jobs:
  deploy:
    name: Publicar frontend
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # A ramificação gh-pages tem só o site (~4 MB). A main ainda é pesada
      # e o GitHub falha ao descarregar o repositório inteiro.
      - uses: actions/checkout@v4
        with:
          ref: gh-pages
          fetch-depth: 1

      - name: Preparar artefacto do site
        run: |
          set -e
          OUT="_site"
          mkdir -p "$OUT"
          rsync -a \
            --exclude '.git/' \
            --exclude '.github/' \
            --exclude '_site/' \
            ./ "$OUT/"
          touch "$OUT/.nojekyll"
          if [ ! -f "$OUT/404.html" ]; then
            cp "$OUT/index.html" "$OUT/404.html"
          fi

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
